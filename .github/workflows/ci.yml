name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: valideat
          POSTGRES_USER: valideat
          POSTGRES_PASSWORD: valideat
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U valideat -d valideat"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/valideat
      QUARKUS_DATASOURCE_USERNAME: valideat
      QUARKUS_DATASOURCE_PASSWORD: valideat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Backend
        working-directory: apps/api/backend
        run: ./mvnw clean verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/web
        run: npm ci

      - name: Build Frontend
        working-directory: apps/web/web
        run: npm run build