<div class="scan-page">

  <app-restaurant-header title="QR-Code scannen" [showBackButton]="true"> </app-restaurant-header>

  <div class="px-4 py-4">
    <div class="row justify-content-center gx-0">
      <main class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

      
        <h1 class="h4 fw-semibold mb-2">Scan bereit</h1>

        <p class="text-secondary mb-3">
          Die Kamera ist hier noch nicht aktiv.
          Der Bereich zeigt nur die spätere Scanfläche.
        </p>

        <div class="scanner-frame mb-4">
          <div class="text-center">

            <div class="scan-corner mx-auto mb-3"></div>

            <p class="fw-semibold mb-1">
              QR-Code im Rahmen ausrichten
            </p>

            <p class="small text-secondary mb-0">
              Statischer Platzhalter ohne Kamera-Zugriff
            </p>

          </div>
        </div>

        <div class="card">
          <div class="card-body">

            <h2 class="h6 mb-3">Demo-Ergebnis öffnen</h2>

            <div class="d-grid gap-2">

              <a routerLink="/restaurant/user/result/success" class="btn btn-outline-success">
                Erfolgreich
              </a>

              <a class="btn btn-outline-warning" routerLink="/restaurant/user/result/already-used">
                Bereits eingelöst
              </a>

              <a routerLink="/restaurant/user/result/invalid" class="btn btn-outline-danger">
                Ungültig oder abgelaufen
              </a>

              <a class="btn btn-outline-secondary" routerLink="/restaurant/user/result/wrong-location">
                Falscher Standort
              </a>

              <a routerLink="/restaurant/user/result/offline" class="btn btn-outline-dark">
                Prüfung nicht möglich
              </a>

            </div>
          </div>
        </div>

      </main>
    </div>


  </div>
</div>
