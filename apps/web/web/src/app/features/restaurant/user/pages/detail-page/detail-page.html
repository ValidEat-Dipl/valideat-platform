<div class="restaurant-detail-page">

  <app-restaurant-header title="Einlösungsdetail" [showBackButton]="true" />

  <div class="px-4 py-4">

    <div class="row gx-0 justify-content-center">

      <main class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

        <h1 class="h4 mb-4 fw-semibold">
          Einlösungsdetail
        </h1>


        <div class="card mb-3">

          <dl class="list-group list-group-flush mb-0">

            <div class="list-group-item d-flex justify-content-between gap-3 px-4 py-3">
              <dt class="text-secondary fw-normal">
                BEISPIEL-ID
              </dt>

              <dd class="mb-0 fw-semibold text-end">
                RED-1001
              </dd>
            </div>


            <div class="list-group-item d-flex justify-content-between gap-3 px-4 py-3">
              <dt class="text-secondary fw-normal">
                ZEITPUNKT
              </dt>

              <dd class="mb-0 fw-semibold text-end">
                Heute, 12:34 Uhr
              </dd>
            </div>


            <div class="list-group-item d-flex justify-content-between gap-3 px-4 py-3">
              <dt class="text-secondary fw-normal">
                STANDORT
              </dt>

              <dd class="mb-0 fw-semibold text-end">
                Restaurant Nord
              </dd>
            </div>


            <div class="list-group-item d-flex justify-content-between gap-3 px-4 py-3">
              <dt class="text-secondary fw-normal">
                MARKERLSTUFE
              </dt>

              <dd class="mb-0 fw-semibold text-end">
                Stufe 2
              </dd>
            </div>


            <div class="list-group-item d-flex justify-content-between gap-3 px-4 py-3">
              <dt class="text-secondary fw-normal">
                STATUS
              </dt>

              <dd class="mb-0">
                <span class="badge rounded-pill text-bg-success">
                  Erfolgreich
                </span>
              </dd>
            </div>

          </dl>

        </div>


        <div class="alert alert-info d-flex gap-2" role="note">

          <i class="bi bi-info-circle flex-shrink-0" aria-hidden="true"></i>

          <span>
            Diese Ansicht enthält nur Beispieldaten und keine echten Personendaten.
          </span>

        </div>


        <a class="btn btn-outline-secondary btn-lg w-100" routerLink="/restaurant/user/history">
          Zurück zum Verlauf
        </a>

      </main>

    </div>

  </div>

</div>
