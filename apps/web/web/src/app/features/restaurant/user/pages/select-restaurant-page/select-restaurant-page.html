<div class="select-restaurant-page">

  <app-restaurant-header title="Restaurant wählen" location="3 Standorte" [showBackButton]="true">
  </app-restaurant-header>

  <div class="px-4 py-4">
    <div class="row justify-content-center gx-0">

      <main class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

        <h1 class="h4 mb-2 fw-semibold">Standort auswählen</h1>

        <p class="text-secondary mb-4">
          Wählen Sie den Standort, an dem Markerl gescannt werden.
          Die Liste ist statisch.
        </p>

        <div class="d-grid gap-3">

          <a routerLink="/restaurant/user/overview" class="card text-decoration-none text-body border-primary">

            <div class="card-body d-flex gap-3 align-items-center">
              <i class="bi bi-geo-alt-fill fs-4 text-primary"></i>

              <div class="me-auto">
                <h2 class="h6 mb-1">Restaurant Nord</h2>
                <p class="small text-secondary mb-0">
                  Aktiver Beispielstandort
                </p>
              </div>

              <span class="badge text-bg-primary">
                Auswählen
              </span>
            </div>

          </a>


          <div class="card">
            <div class="card-body d-flex align-items-center gap-3">

              <i class="bi bi-geo-alt text-secondary fs-4"></i>

              <div class="me-auto">
                <h2 class="h6 mb-1">Restaurant Süd</h2>
                <p class="small text-secondary mb-0">
                  Platzhalter für weiteren Standort
                </p>
              </div>

              <span class="badge text-bg-light">Statisch</span>
            </div>
          </div>

          <div class="card">

            <div class="card-body d-flex gap-3 align-items-center">
              <i class="bi bi-geo-alt fs-4 text-secondary"></i>

              <div class="me-auto">
                <h2 class="h6 mb-1">
                  Restaurant Campus
                </h2>

                <p class="small text-secondary mb-0">
                  Platzhalter für späteren Mandantenbetrieb
                </p>
              </div>

              <span class="badge text-bg-light">
                Statisch
              </span>
            </div>

          </div>

        </div>
      </main>
    </div>


  </div>

</div>
