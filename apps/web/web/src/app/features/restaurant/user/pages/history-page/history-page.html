<div class="restaurant-history-page d-flex flex-column">

  <app-restaurant-header title="Verlauf" [showBackButton]="true" />

  <div class="flex-grow-1 px-4 py-4">


    <div class="row gx-0 justify-content-center">

      <main class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">

        <h1 class="h4 mb-2 fw-semibold">
          Letzte Einlösungen
        </h1>

        <p class="text-secondary mb-4">
          Statische Beispielliste für Restaurant-Mitarbeitende.
        </p>


        <div class="card mb-4">
          <div class="list-group list-group-flush">

            <a class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              routerLink="/restaurant/user/history/detail">

              <span class="result-dot bg-success-subtle text-success">
                <i class="bi bi-check2" aria-hidden="true"></i>
              </span>

              <span class="me-auto">
                <strong class="d-block">
                  Stufe 2 eingelöst
                </strong>
                <span class="small text-secondary">
                  Heute, 12:34 Uhr
                </span>
              </span>

              <i class="bi bi-chevron-right text-secondary" aria-hidden="true"></i>
            </a>


            <a class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              routerLink="/restaurant/user/history/detail">

              <span class="result-dot bg-warning-subtle text-warning-emphasis">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
              </span>

              <span class="me-auto">
                <strong class="d-block">
                  Bereits eingelöst
                </strong>

                <span class="small text-secondary">
                  Heute, 11:18 Uhr
                </span>
              </span>

              <i class="bi bi-chevron-right text-secondary" aria-hidden="true"></i>
            </a>


            <a class="list-group-item list-group-item-action d-flex align-items-center gap-3"
              routerLink="/restaurant/user/history/detail">

              <span class="result-dot bg-danger-subtle text-danger">
                <i class="bi bi-x-lg" aria-hidden="true"></i>
              </span>

              <span class="me-auto">
                <strong class="d-block">
                  Ungültiger QR-Code
                </strong>
                <span class="small text-secondary">
                  Gestern, 13:05 Uhr
                </span>
              </span>

              <i class="bi bi-chevron-right text-secondary" aria-hidden="true"></i>

            </a>

          </div>
        </div>


        <a class="btn btn-primary btn-lg w-100" routerLink="/restaurant/user/scan">
          QR-Code scannen
        </a>

      </main>

    </div>


  </div>

  <app-restaurant-navigation />

</div>
