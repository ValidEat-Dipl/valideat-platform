<section class="restaurant-login-page d-flex align-items-center px-4 py-5">
  <div class="row gx-0 w-100 justify-content-center">

    <main class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">

      <div class="text-center mb-4">
        <div class="brand-mark d-grid mx-auto mb-3 text-white fw-bold" aria-hidden="true">VE</div>

        <p class="brand-name mb-2 text-uppercase text-secondary">Restaurant</p>

        <h1 class="h3 fw-semibold">Scanner anmelden</h1>

      </div>

      <!--- Form -->
      <form class="card p-4" aria-label="Restaurant Login Formular">


        <div class="mb-3">
          <label class="form-label" for="restaurant-email">E-Mail</label>

          <input
            class="form-control"
            id="restaurant-email"
            type="email"
            value="scanner@example.invalid"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="restaurant-password">Passwort</label>
          
          <input class="form-control" id="restaurant-password" type="password" value="password" />
        </div>

        <!--- Alert noch ned funktionsfähig -->
        <p class="small text-secondary mb-3">Beispieldaten, noch keine echte Anmeldung.</p>

        <a class="btn btn-primary btn-lg w-100" routerLink="/restaurant/user/select">Anmelden</a>

      </form>

    </main>

  </div>
</section>
