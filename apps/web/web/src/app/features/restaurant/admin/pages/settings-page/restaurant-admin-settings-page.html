<div class="admin-shell">
  <app-restaurant-admin-sidebar />

  <main class="admin-main">
    <div class="text-secondary fs-5 mb-4">
      Restaurant <span class="mx-2">/</span> <span class="text-dark fw-medium">Einstellungen</span>
    </div>

    <h1 class="mb-4">Einstellungen</h1>

    <div class="settings-grid">
      <div class="card">
        <div class="card-header bg-white fw-semibold">Restaurantdaten</div>

        <div class="card-body">
          <div class="info-row">
            <span>Restaurantname</span>
            <strong>{{ restaurantName() }}</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-white fw-semibold">Letzte Einlösung</div>

        <div class="card-body">
          <div class="info-row">
            <span>Datum</span>
            <strong>{{ lastScan() }}</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-white fw-semibold">Kontakt</div>

        <div class="card-body">
          <div class="info-row">
            <span>Kontaktperson</span>
            <strong>{{ contactName() }}</strong>
          </div>

          <div class="info-row">
            <span>E-Mail</span>
            <strong>{{ contactMail() }}</strong>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
