<div class="d-flex justify-content-center align-items-center p-4"
     style="min-height: calc(100vh - 80px);">
  <div class="border rounded-4 p-4 w-100"
       style="max-width: 450px;">
    <h1 class="mb-4 text-center">Anmeldung</h1>
    <form [formGroup]="form"
          (ngSubmit)="onSubmit()"
          class="d-grid gap-3">
      <div>
        <label for="email" class="form-label">
          E-Mail
        </label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email">
      </div>
      <div>
        <label for="password" class="form-label">
          Passwort
        </label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password">
      </div>
      @if (loginError()) {
        <div class="alert alert-danger m-0">
          E-Mail oder Passwort ist falsch.
        </div>
      }
      <app-button-comp
        buttonType="submit"
        buttonDesignType="primary"
        text="Anmelden"
        [disabled]="form.invalid || form.pending || isLoading()">
      </app-button-comp>
    </form>
    <div class="text-center mt-4">
      Noch kein Konto?
      <a href="/register">
        Registrieren
      </a>
    </div>
  </div>
</div>
